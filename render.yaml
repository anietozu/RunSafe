databases:
  - name: runsafe-db
    databaseName: runsafe
    user: runsafe
    plan: free

services:
  - type: web
    name: runsafe-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: runsafe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
